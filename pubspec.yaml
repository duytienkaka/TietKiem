name: tietkiem
description: Offline-first personal finance manager built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  drift_flutter: ^0.2.8
  fl_chart: ^1.1.1
  flutter_riverpod: ^2.6.1
  file_picker: ^10.1.9
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  go_router: ^16.2.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  timezone: ^0.11.0
  sqlite3: 2.9.4
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.1
  math_expressions: ^3.1.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
